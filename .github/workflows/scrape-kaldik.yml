name: Scrape Kalender Pendidikan KBB

on:
  schedule:
    - cron: '0 1 * * *' # Berjalan setiap hari pukul 01.00 WIB (18.00 UTC)
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: |
          python script/scrape-kaldik-kbb.py

      - name: Commit and Push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Kalender Pendidikan KBB $(date +'%Y-%m-%d')" && git push)
